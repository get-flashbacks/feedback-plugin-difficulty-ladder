name: custom-checks

# Self-contained pre-merge checks. This repo is an original (not a fork), so
# there's no upstream org tooling to depend on — these checks are inlined
# rather than referencing a shared reusable workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PLUGIN_DIR: "."

jobs:
  # NOTE: this is deliberately NOT a "folder name == id" check. plugin.json's
  # id is "difficulty_ladder" but this repo is named
  # "feedback-plugin-difficulty-ladder" — that mismatch is intentional (see
  # CLAUDE.md: the org's repo-naming convention prefixes plugin repos, but
  # ids stay short/underscored). actions/checkout names the workspace after
  # the *git repo*, not the folder name the plugin ends up under once someone
  # installs it into a Host's plugins/ dir — comparing those would be a
  # guaranteed false failure. The only thing this repo's own content can
  # verify is that the id itself is well-formed; the real folder-name==id
  # invariant has to be enforced at install time, not here.
  plugin-id-is-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin.json id must be a well-formed identifier
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          manifest_path = os.path.join(os.environ["PLUGIN_DIR"], "plugin.json")
          pid = json.load(open(manifest_path)).get("id", "")
          if not re.match(r"^[a-z0-9][a-z0-9_-]*$", pid):
              print(f"::error file={manifest_path}::plugin.json id {pid!r} is not a valid identifier (expected ^[a-z0-9][a-z0-9_-]*$)")
              sys.exit(1)
          print(f"OK: id {pid!r} is well-formed")
          PY

  no-print-in-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No print()/traceback.print_exc() in routes.py
        run: |
          set -eu
          FILE="$PLUGIN_DIR/routes.py"
          if [ ! -f "$FILE" ]; then
            echo "No routes.py — skipping"
            exit 0
          fi
          hits=$(grep -nE '(^|[^A-Za-z0-9_])(print|traceback\.print_exc)[[:space:]]*\(' "$FILE" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error file=$FILE::print()/traceback.print_exc() found — use context['log'] instead"
            exit 1
          fi
          echo "OK: no print()/traceback.print_exc() in routes.py"

  safe-server-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: settings/diagnostics server_files must be safe relpaths
        run: |
          python3 - <<'PY'
          import json, os, sys
          manifest_path = os.path.join(os.environ["PLUGIN_DIR"], "plugin.json")
          manifest = json.load(open(manifest_path))
          bad = []
          for section in ("settings", "diagnostics"):
              for entry in (manifest.get(section, {}) or {}).get("server_files", []) or []:
                  parts = entry.split("/")
                  if entry.startswith("/") or ".." in parts or "\\" in entry or entry.startswith("."):
                      bad.append(f"{section}.server_files: {entry!r}")
          if bad:
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)
          print("OK: server_files entries are safe relpaths")
          PY
